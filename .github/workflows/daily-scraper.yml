name: Daily Screener Sector Trends Fetcher

on:
  schedule:
    # 13:30 UTC is 19:00 (7:00 PM) IST, Monday to Friday
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Scrape Screener Market & Update Snapshots
        run: npm run fetch:daily

      - name: Commit & Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/snapshots.json data/screener_industry_data.json
          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            git commit -m "Auto-fetch: Screener industry trends $(date -u +'%Y-%m-%d')"
            git push
            echo "Successfully pushed latest industry snapshot to repository."
          fi
